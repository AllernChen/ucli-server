server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 32m;
  location /api/ { proxy_pass http://api:3000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location /docs { proxy_pass http://api:3000; }
  location /gateway/ { rewrite ^/gateway/(.*)$ /$1 break; proxy_pass http://gateway:3001; proxy_http_version 1.1; proxy_buffering off; proxy_read_timeout 300s; }
  location / { try_files $uri $uri/ /index.html; }
}

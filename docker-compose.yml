services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ucli
      POSTGRES_USER: ucli
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ucli-change-me}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U ucli"], interval: 5s, timeout: 3s, retries: 20 }

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    volumes: [redis-data:/data]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 20 }

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ucli}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ucli-change-me-now}
    volumes: [minio-data:/data]

  migrate:
    build: { context: ., target: runtime }
    command: npx prisma migrate deploy
    environment: &app-env
      DATABASE_URL: postgresql://ucli:${POSTGRES_PASSWORD:-ucli-change-me}@postgres:5432/ucli
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-ucli}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-ucli-change-me-now}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      SETUP_SECRET: ${SETUP_SECRET:?SETUP_SECRET is required}
      MASTER_KEY: ${MASTER_KEY:?MASTER_KEY is required}
      PUBLIC_URL: ${PUBLIC_URL:?PUBLIC_URL is required}
      GATEWAY_PUBLIC_URL: ${GATEWAY_PUBLIC_URL:-http://localhost/gateway}
    depends_on: { postgres: { condition: service_healthy } }

  api:
    build: { context: ., target: runtime }
    environment: *app-env
    command: node dist/apps/api/src/main.js
    depends_on: { migrate: { condition: service_completed_successfully }, redis: { condition: service_healthy } }
    healthcheck: { test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/healthz"], interval: 10s, timeout: 5s, retries: 12 }

  gateway:
    build: { context: ., target: runtime }
    environment: *app-env
    command: node dist/apps/gateway/src/main.js
    depends_on: { migrate: { condition: service_completed_successfully }, redis: { condition: service_healthy } }
    healthcheck: { test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3001/healthz"], interval: 10s, timeout: 5s, retries: 12 }

  worker:
    build: { context: ., target: runtime }
    environment: *app-env
    command: node dist/apps/worker/src/main.js
    depends_on: { migrate: { condition: service_completed_successfully }, redis: { condition: service_healthy } }

  web:
    build: { context: ., target: admin }
    ports: ["${HTTP_PORT:-80}:80"]
    depends_on: { api: { condition: service_healthy }, gateway: { condition: service_healthy } }

  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes: ["./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro", prometheus-data:/prometheus]
    depends_on: { api: { condition: service_healthy }, gateway: { condition: service_healthy } }

  loki:
    image: grafana/loki:3.5.3
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes: [loki-data:/loki]

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-ucli-change-me}
    ports: ["${GRAFANA_PORT:-3002}:3000"]
    volumes: [grafana-data:/var/lib/grafana, "./deploy/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro", "./deploy/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro", "./deploy/dashboards:/etc/grafana/dashboards:ro"]
    depends_on: [prometheus, loki]

  promtail:
    image: grafana/promtail:2.9.14
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes: ["./deploy/promtail.yml:/etc/promtail/config.yml:ro", "/var/run/docker.sock:/var/run/docker.sock:ro"]
    depends_on: [loki]

volumes:
  postgres-data:
  redis-data:
  minio-data:
  prometheus-data:
  loki-data:
  grafana-data:

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run db:generate
        env:
          DATABASE_URL: postgresql://ucli:ucli@localhost:5432/ucli
      - name: Verify
        run: npm run verify

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build Docker images
        run: docker compose build
        env:
          JWT_SECRET: ci-build-placeholder
          SETUP_SECRET: ci-build-placeholder
          MASTER_KEY: ci-build-placeholder
          PUBLIC_URL: http://localhost:3000
